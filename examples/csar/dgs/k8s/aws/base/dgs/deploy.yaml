apiVersion: apps/v1
kind: Deployment
metadata:
  name: dgs
  labels:
    component: dgs
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 50%
      maxSurge: 10%
  selector:
    matchLabels:
      component: dgs
  template:
    metadata:
      labels:
        component: dgs
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 600
      initContainers:
        - image: alpine:latest
          name: tuner
          command:
            - /bin/sh
            - -c
            - |
              set -e
              sysctl -w kernel.msgmax=65536
              sysctl -w kernel.msgmnb=65536
              sysctl -w net.core.somaxconn=32768
              sysctl -w net.netfilter.nf_conntrack_max=1048576
              sysctl -w net.ipv4.tcp_syncookies=0
              sysctl -w net.core.somaxconn=32768
              sysctl -w net.ipv4.tcp_max_syn_backlog=32768
              sysctl -w net.core.wmem_default=25165824
              sysctl -w net.core.wmem_max=25165824
              sysctl -w net.core.rmem_default=25165824
              sysctl -w net.core.rmem_max=25165824
              sysctl -w net.core.optmem_max=25165824
              sysctl -w net.core.netdev_max_backlog=65536
              sysctl -w net.ipv4.udp_mem="65536 131072 262144"
              sysctl -w net.ipv4.udp_rmem_min=16384
              sysctl -w net.ipv4.udp_wmem_min=16384
              sysctl -w net.ipv4.tcp_tw_reuse=1
          imagePullPolicy: Always
          securityContext:
            privileged: true
      containers:
        - name: dgs
          # Configure Probes: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
          startupProbe: &probe
            exec:
              command:
                - sh
                - -c
                - "/go/bin/health-check $(cat /tmp/DIARKIS_MESH_ADDR) mars /bin/tools/configs/health-check-for-startup-probe.json"
                - "&& /go/bin/health-check $(cat /tmp/DIARKIS_PUBLIC_ADDR) out /bin/tools/configs/health-check-for-startup-probe.json"
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            <<: *probe
            exec:
              command:
                - sh
                - -c
                - "/go/bin/health-check $(cat /tmp/DIARKIS_MESH_ADDR) in /bin/tools/configs/health-check-for-liveness-probe.json"
                - "&& /go/bin/health-check $(cat /tmp/DIARKIS_PUBLIC_ADDR) out /bin/tools/configs/health-check-for-liveness-probe.json"
          readinessProbe:
            <<: *probe
            exec:
              command:
                - sh
                - -c
                - "/go/bin/health-check $(cat /tmp/DIARKIS_MESH_ADDR) in /bin/tools/configs/health-check-for-readiness-probe.json"
                - "&& /go/bin/health-check $(cat /tmp/DIARKIS_PUBLIC_ADDR) out /bin/tools/configs/health-check-for-readiness-probe.json"
          securityContext:
            runAsUser: 1000
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            privileged: false
          image: dgs
          imagePullPolicy: Always
          env:
            - name: DIARKIS_CLOUD_ENV
              value: AWS
            - name: DIARKIS_SHUTDOWN_TIMEOUT
              value: "600"
          command:
            - /dgs_bin/linux-server.x86_64
          args:
            - "/configs/shared/log.json"
            - "/configs/shared/mesh.json"
            - "0.0.0.0"
            - "7400"
            - "AWS"
          volumeMounts:
            - mountPath: /configs/shared
              name: shared-conf
            - mountPath: /configs/dgs
              name: dgs-conf
            - name: hc-conf
              mountPath: /bin/tools/configs
            - name: tmp
              mountPath: /tmp
      nodeSelector:
        eks.amazonaws.com/nodegroup: diarkis-public
      volumes:
        - name: shared-conf
          projected:
            sources:
              - configMap:
                  name: shared-conf
              - configMap:
                  name: mesh-conf-public
        - name: dgs-conf
          configMap:
            name: dgs-conf
        - name: hc-conf
          configMap:
            name: hc-conf
        - name: tmp
          emptyDir: {}

namespace: dev0
resources:
  - ../../base
  - dgs/scaledobject.yaml

# build target
patches:
  - path: http/deploy.yaml
  - path: udp/deploy.yaml
  - path: dgs/deploy.yaml

images:
  - name: __AWS_ACCOUNT_NUM__.dkr.ecr.ap-northeast-1.amazonaws.com/udp
    newTag: dev0
  - name: __AWS_ACCOUNT_NUM__.dkr.ecr.ap-northeast-1.amazonaws.com/mars
    newTag: dev0
  - name: __AWS_ACCOUNT_NUM__.dkr.ecr.ap-northeast-1.amazonaws.com/http
    newTag: dev0
  - name: __AWS_ACCOUNT_NUM__.dkr.ecr.ap-northeast-1.amazonaws.com/dgs
    newTag: dev0

configMapGenerator:
  - name: shared-conf
    behavior: replace
    files:
      - shared/conf/field.json
      - shared/conf/group.json
      - shared/conf/log.json
      - shared/conf/matching.json
      - shared/conf/mesh.json
      - shared/conf/dm.json
      - shared/conf/dive.json
      - shared/conf/room.json
      - shared/conf/dgs.json

  - name: mesh-conf-public
    behavior: replace
    files:
      - shared/conf/public/mesh.json

  - name: http-conf
    behavior: replace
    files:
      - http/conf/main.json

  - name: udp-conf
    behavior: replace
    files:
      - udp/conf/main.json

  - name: dgs-conf
    behavior: replace
    files:
      - dgs/conf/main.json

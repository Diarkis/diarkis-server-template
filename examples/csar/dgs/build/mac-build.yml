buildSettings:
  env:
    CGO_CFLAGS: -I${PROJECT_DIR}
    CGO_LDFLAGS: -L${PROJECT_DIR} -Wl,-rpath,${PROJECT_DIR}
    GOARCH: arm64
    GOOS: darwin
  goVersion: 1.24.0
  projects:
    cli:
      output: remote_bin/cli
      target: client/main.go
      debug: true
    http:
      output: remote_bin/http
      target: servers/http/main.go
      debug: true
    mars:
      output: remote_bin/mars
      target: mars/main.go
      debug: true
    udp:
      output: remote_bin/udp
      target: servers/udp/main.go
      debug: true
    dgs:
      output: remote_bin/dgs
      target: ./servers/dgs/main.go
      debug: true
    health-check:
      output: remote_bin/tools/health-check
      target: ./tools/healthcheck
  root: ..
  version: "2"
diarkis:
  builder_token: "{{BUILD_TOKEN}}"
  project_id: "{{PROJECT_ID}}"

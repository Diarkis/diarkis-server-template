# global:
#   extraEnvFrom:
#     - secretRef:
#         name: linode-s3-creds

chunksCache:
  resources:
    requests:
      memory: "128Mi"
    limits:
      memory: "512Mi"

loki:
  # server:
  #   log_level: debug
  schemaConfig:
    configs:
      - from: "2025-03-14"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage_config:
    tsdb_shipper:
      active_index_directory: /var/loki/index
      cache_location: /var/loki/index_cache
      cache_ttl: 24h
    aws:
      endpoint: jp-osa-1.linodeobjects.com
      region: jp-osa-1
      s3forcepathstyle: true
      insecure: false
      access_key_id: "${AWS_ACCESS_KEY_ID}"
      secret_access_key: "${AWS_ACCESS_KEY_SECRET}"
  pattern_ingester:
    enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    # 7 days
    retention_period: 168h
  storage:
    type: s3
    # create a bucket named logs-diarkis or change the bucketNames to match your bucket names
    bucketNames:
      chunks: logs-diarkis
      ruler: logs-diarkis
      admin: logs-diarkis
    s3:
      endpoint: jp-osa-1.linodeobjects.com
      region: jp-osa-1
      s3forcepathstyle: true
      insecure: false
      accessKeyId: "${AWS_ACCESS_KEY_ID}"
      secretAccessKey: "${AWS_ACCESS_KEY_SECRET}"
  gateway:
    enabled: true
  auth_enabled: false

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mars
spec:
  serviceName: "mars"
  replicas: 1
  selector:
    matchLabels:
      component: mars
  template:
    metadata:
      labels:
        component: mars
    spec:
      containers:
        - name: mars
          image: mars
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "50m"
              memory: "100M"
            limits:
              cpu: "50m"
              memory: "100M"
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "/go/bin/health-check mars:6779 show-mars /bin/tools/configs/health-check-for-liveness-probe.json"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          ports:
            - containerPort: 6779
              name: mars
              protocol: UDP
          volumeMounts:
            - name: mars-conf
              mountPath: /bin/mars
            - name: hc-conf
              mountPath: /bin/tools/configs
      volumes:
        - name: mars-conf
          configMap:
            name: mars-conf
        - name: hc-conf
          configMap:
            name: hc-conf

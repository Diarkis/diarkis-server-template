apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcp
  labels:
    component: tcp
spec:
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 50%
      maxSurge: 10%
  selector:
    matchLabels:
      component: tcp
  template:
    metadata:
      labels:
        component: tcp
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
        ad.datadoghq.com/tuner.logs: '[{"source":"tuner","service":"tcp"}]'
        ad.datadoghq.com/tcp.logs: '[{"source":"tcp","service":"tcp"}]'
    spec:
      terminationGracePeriodSeconds: 600
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: tcp
          # Configure Probes: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
          startupProbe: &probe
            exec:
              command:
                - sh
                - -c
                - "/go/bin/health-check $(cat /tmp/DIARKIS_MESH_ADDR) mars /bin/tools/configs/health-check-for-startup-probe.json"
                - "&& /go/bin/health-check $(cat /tmp/DIARKIS_PUBLIC_ADDR) out /bin/tools/configs/health-check-for-startup-probe.json"
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            <<: *probe
            exec:
              command:
                - sh
                - -c
                - "/go/bin/health-check $(cat /tmp/DIARKIS_MESH_ADDR) in /bin/tools/configs/health-check-for-liveness-probe.json"
                - "&& /go/bin/health-check $(cat /tmp/DIARKIS_PUBLIC_ADDR) out /bin/tools/configs/health-check-for-liveness-probe.json"
          readinessProbe:
            <<: *probe
            exec:
              command:
                - sh
                - -c
                - "/go/bin/health-check $(cat /tmp/DIARKIS_MESH_ADDR) in /bin/tools/configs/health-check-for-readiness-probe.json"
                - "&& /go/bin/health-check $(cat /tmp/DIARKIS_PUBLIC_ADDR) out /bin/tools/configs/health-check-for-readiness-probe.json"
          securityContext:
            runAsUser: 1000
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            privileged: false
          image: tcp
          imagePullPolicy: Always
          env:
            - name: DIARKIS_CLOUD_ENV
              value: GCP
            - name: DIARKIS_SHUTDOWN_TIMEOUT
              value: "600"
          command:
            - /go/bin/tcp
          volumeMounts:
            - mountPath: /configs/tcp
              name: tcp-conf
            - mountPath: /configs/shared
              name: shared-conf
            - name: hc-conf
              mountPath: /bin/tools/configs
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: shared-conf
          configMap:
            name: shared-conf
        - name: tcp-conf
          configMap:
            name: tcp-conf
        - name: hc-conf
          configMap:
            name: hc-conf
        - name: tmp
          emptyDir: {}
